<!doctype html><meta charset="utf-8"><title>QA</title>
<pre id="out">RUNNING</pre><iframe id="app" src="index.html" style="width:1200px;height:900px"></iframe>
<script>
const out=document.getElementById('out'); const results=[]; const log=(name,ok,detail='')=>results.push({name,ok,detail});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('app').addEventListener('load',async()=>{
 const w=document.getElementById('app').contentWindow, d=w.document;
 const errors=[]; w.addEventListener('error',e=>errors.push(e.message)); w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 await sleep(1500);
 log('initial boot',!!d.querySelector('#labSelect')&&!!d.querySelector('#pageContent .hero'),d.title);
 for(const id of ['lab-01','lab-02','lab-03','lab-04']){
   const sel=d.querySelector('#labSelect'); sel.value=id; sel.dispatchEvent(new w.Event('change',{bubbles:true}));
   await sleep(1800);
   const text=d.querySelector('#pageContent')?.innerText||'';
   if(id==='lab-01') log('lab 01 renders',text.includes('Wine Quality')||text.includes('WINE QUALITY'),text.slice(0,120).replace(/\n/g,' '));
   if(id==='lab-02') log('lab 02 data loaded',text.includes('9 982')||text.includes('9,982'),text.match(/DATA LOADED LOCALLY|Данные загружены|Загрузка локального CSV/g)?.join(',')||'');
   if(id==='lab-03') log('lab 03 graceful missing CSV',text.includes('chembl_egfr_ic50.csv')&&text.includes('не найден'),text.slice(0,180).replace(/\n/g,' '));
   if(id==='lab-04') log('lab 04 graceful missing CSV',text.includes('qm9_three_properties.csv')&&text.includes('не найден'),text.slice(0,180).replace(/\n/g,' '));
 }
 log('no runtime errors',errors.length===0,errors.join(' | '));
 out.textContent=JSON.stringify(results,null,2);
});
</script>
